name: Signaler une erreur
description: Une date, un titre, une phase ou un rôle vous semble faux ? Indiquez la source.
title: "Erreur : "
labels: ["revue-données"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Aucune donnée personnelle n'est demandée. Le site ne publie que des informations sourcées :
        pour corriger, le plus efficace est souvent de corriger la source (Wikidata ou Wikipédia) et de nous l'indiquer.
  - type: input
    id: oeuvre
    attributes:
      label: Œuvre ou page concernée
      placeholder: "ex. Avengers : Endgame"
    validations:
      required: true
  - type: textarea
    id: erreur
    attributes:
      label: Ce qui est faux
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source qui montre la bonne information (lien)
      placeholder: "https://…"
